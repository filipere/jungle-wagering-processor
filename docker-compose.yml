services:
  wagering_db:
    image: postgres:15-alpine
    container_name: wagering_db
    environment:
      POSTGRES_DB: wagering_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: